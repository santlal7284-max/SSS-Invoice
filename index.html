<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M/S SANT SALES & SERVICE - Invoice Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea * { visibility: visible; }
      #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <div class="max-w-6xl mx-auto p-4 sm:p-6">
    <!-- Header -->
    <header class="bg-white rounded-lg shadow p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-blue-700" id="companyTitle">M/S SANT SALES & SERVICE</h1>
        <p class="text-sm text-gray-600" id="companySub">GSTIN: 06AWEPR6592C1ZC | Faridabad, Haryana</p>
      </div>
      <div class="flex gap-2">
        <button onclick="switchTab('create')" class="px-4 py-2 bg-blue-600 text-white rounded shadow hover:bg-blue-700">New Bill</button>
        <button onclick="switchTab('history')" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">History</button>
        <button onclick="switchTab('settings')" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Settings</button>
      </div>
    </header>

    <!-- App Content Tabs -->
    <main id="appContent" class="bg-white rounded-lg shadow p-6">
      
      <!-- TAB 1: CREATE INVOICE -->
      <section id="tab-create">
        <h2 class="text-xl font-bold mb-4 border-b pb-2">Generate New Invoice</h2>
        <form id="invoiceForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-medium">Invoice Type</label>
              <select id="invType" onchange="autoUpdateInvoiceNo()" class="w-full border rounded p-2 mt-1">
                <option value="normal">Retail Invoice (SSS/07/TM/..)</option>
                <option value="gst">GST Invoice (SSS/08/VNS/..)</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium">Invoice No.</label>
              <input type="text" id="invNo" required class="w-full border rounded p-2 mt-1 bg-gray-50">
            </div>
            <div>
              <label class="block text-sm font-medium">Date</label>
              <input type="date" id="invDate" required class="w-full border rounded p-2 mt-1">
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="border p-3 rounded">
              <h3 class="font-semibold mb-2">Customer / Buyer Details</h3>
              <input type="text" id="buyerName" placeholder="Customer Name" required class="w-full border rounded p-2 mb-2">
              <input type="text" id="buyerMobile" placeholder="Mobile No." class="w-full border rounded p-2 mb-2">
              <textarea id="buyerAddress" placeholder="Address" class="w-full border rounded p-2 mb-2" rows="2"></textarea>
              <input type="text" id="buyerGstin" placeholder="GSTIN (Optional)" class="w-full border rounded p-2 mb-2">
              <input type="text" id="buyerStateCode" placeholder="State Code (e.g. 06 for HR, 07 for DL)" value="06" class="w-full border rounded p-2">
            </div>

            <div class="border p-3 rounded">
              <h3 class="font-semibold mb-2">Add Items</h3>
              <div class="space-y-2">
                <input type="text" id="itemDesc" placeholder="Item Description" class="w-full border rounded p-2">
                <div class="grid grid-cols-3 gap-2">
                  <input type="text" id="itemHsn" placeholder="HSN/SAC" class="border rounded p-2">
                  <input type="number" id="itemQty" placeholder="Qty" value="1" class="border rounded p-2">
                  <input type="number" id="itemRate" placeholder="Rate (₹)" class="border rounded p-2">
                </div>
                <button type="button" onclick="addItemToGrid()" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">+ Add Item</button>
              </div>
            </div>
          </div>

          <!-- Items Table -->
          <div class="overflow-x-auto mt-4">
            <table class="w-full border text-left text-sm">
              <thead class="bg-gray-100 border-b">
                <tr>
                  <th class="p-2">Description</th>
                  <th class="p-2">HSN</th>
                  <th class="p-2">Qty</th>
                  <th class="p-2">Rate</th>
                  <th class="p-2">Amount</th>
                  <th class="p-2">Action</th>
                </tr>
              </thead>
              <tbody id="itemsTableBody"></tbody>
            </table>
          </div>

          <div class="flex justify-end gap-3 mt-4">
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded font-semibold hover:bg-blue-700">Save & Print Invoice</button>
          </div>
        </form>
      </section>

      <!-- TAB 2: HISTORY -->
      <section id="tab-history" class="hidden">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <h2 class="text-xl font-bold">Invoice History</h2>
          <div class="flex gap-2">
            <button onclick="exportData()" class="bg-green-600 text-white px-3 py-1 text-sm rounded">Export Backup JSON</button>
            <label class="bg-yellow-600 text-white px-3 py-1 text-sm rounded cursor-pointer">
              Import Backup <input type="file" onchange="importData(event)" class="hidden" accept=".json">
            </label>
          </div>
        </div>

        <div class="flex border-b mb-4">
          <button id="filterGstBtn" onclick="filterHistory('gst')" class="px-4 py-2 border-b-2 border-blue-600 font-semibold text-blue-600">GST Invoices</button>
          <button id="filterNormalBtn" onclick="filterHistory('normal')" class="px-4 py-2 font-semibold text-gray-500">Retail Invoices</button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full border text-left text-sm">
            <thead class="bg-gray-100 border-b">
              <tr>
                <th class="p-2">Inv No</th>
                <th class="p-2">Date</th>
                <th class="p-2">Buyer</th>
                <th class="p-2">Amount</th>
                <th class="p-2">Actions</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </section>

      <!-- TAB 3: SETTINGS -->
      <section id="tab-settings" class="hidden">
        <h2 class="text-xl font-bold mb-4 border-b pb-2">Settings & Configuration</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium">Company Name</label>
            <input type="text" id="cfgCompanyName" class="w-full border rounded p-2 mb-2">
            <label class="block text-sm font-medium">GSTIN</label>
            <input type="text" id="cfgGstin" class="w-full border rounded p-2 mb-2">
            <label class="block text-sm font-medium">Retail Prefix</label>
            <input type="text" id="cfgPrefix" class="w-full border rounded p-2 mb-2">
            <label class="block text-sm font-medium">GST Prefix</label>
            <input type="text" id="cfgGstPrefix" class="w-full border rounded p-2 mb-2">
          </div>
          <div>
            <label class="block text-sm font-medium">Address</label>
            <textarea id="cfgAddress" class="w-full border rounded p-2 mb-2" rows="3"></textarea>
            <label class="block text-sm font-medium">Contact Mobile</label>
            <input type="text" id="cfgContact" class="w-full border rounded p-2 mb-2">
          </div>
        </div>
        <button onclick="saveSettings()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded">Save Settings</button>
      </section>

    </main>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // 1. Persistent Storage Request (Prevents auto-clearing by browser)
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then(granted => {
        console.log("Persistent Storage Granted:", granted);
      });
    }

    // Initial Default Application State
    let settings = {
      companyName: "M/S SANT SALES & SERVICE",
      address: "SHOP NO-2, O-GALI NO-2 GAADA COLONY NEAR KHUSHI GARDEN FARIDABAD HARYANA 121002",
      contact: "9818011471",
      email: "santservicenoida@gmail.com",
      gstin: "06AWEPR6592C1ZC",
      stateCode: "06",
      pan: "AWEPR6592C",
      gstRate: 18,
      prefix: "SSS/07/TM/",
      nextNum: 41,
      gstPrefix: "SSS/08/VNS/",
      gstNextNum: 33
    };

    let invoices = [];
    let currentItems = [];
    let currentFilter = 'gst';

    // Load Local Storage Data
    function loadStorageData() {
      const storedSettings = localStorage.getItem('app_settings');
      if (storedSettings) settings = JSON.parse(storedSettings);
      
      const storedInvoices = localStorage.getItem('app_invoices');
      if (storedInvoices) invoices = JSON.parse(storedInvoices);

      document.getElementById('invDate').valueAsDate = new Date();
      autoUpdateInvoiceNo();
      loadSettingsToForm();
    }

    function saveToStorage() {
      localStorage.setItem('app_settings', JSON.stringify(settings));
      localStorage.setItem('app_invoices', JSON.stringify(invoices));
    }

    // 2. Smart Smart GST vs Normal Invoice Filtering Logic
    function invoiceTypeOf(inv) {
      const invNo = (inv.invoiceNo || '').toUpperCase();
      const gstPre = (settings.gstPrefix || '').toUpperCase();

      if (inv.isGst || inv.isGstInvoice || invNo.includes('VNS') || invNo.includes('GST') || (gstPre && invNo.startsWith(gstPre))) {
        return 'gst';
      }
      return 'normal';
    }

    // Automatic Prefix & Invoice No setup
    function autoUpdateInvoiceNo() {
      const type = document.getElementById('invType').value;
      if (type === 'gst') {
        document.getElementById('invNo').value = settings.gstPrefix + settings.gstNextNum;
      } else {
        document.getElementById('invNo').value = settings.prefix + settings.nextNum;
      }
    }

    // Add Items
    function addItemToGrid() {
      const desc = document.getElementById('itemDesc').value;
      const hsn = document.getElementById('itemHsn').value;
      const qty = parseFloat(document.getElementById('itemQty').value) || 1;
      const rate = parseFloat(document.getElementById('itemRate').value) || 0;

      if (!desc || rate <= 0) return alert('Please enter valid item details!');

      currentItems.push({ desc, hsn, qty, rate, total: qty * rate });
      renderItemsTable();

      document.getElementById('itemDesc').value = '';
      document.getElementById('itemHsn').value = '';
      document.getElementById('itemRate').value = '';
    }

    function renderItemsTable() {
      const tbody = document.getElementById('itemsTableBody');
      tbody.innerHTML = '';
      currentItems.forEach((item, idx) => {
        tbody.innerHTML += `
          <tr class="border-b">
            <td class="p-2">${item.desc}</td>
            <td class="p-2">${item.hsn}</td>
            <td class="p-2">${item.qty}</td>
            <td class="p-2">₹${item.rate}</td>
            <td class="p-2">₹${item.total}</td>
            <td class="p-2"><button onclick="removeItem(${idx})" class="text-red-600 font-bold">X</button></td>
          </tr>
        `;
      });
    }

    function removeItem(idx) {
      currentItems.splice(idx, 1);
      renderItemsTable();
    }

    // Save Form
    function handleFormSubmit(e) {
      e.preventDefault();
      if (currentItems.length === 0) return alert("Add at least one item!");

      const invType = document.getElementById('invType').value;
      const totalAmount = currentItems.reduce((acc, i) => acc + i.total, 0);

      const newInv = {
        id: Date.now(),
        invoiceNo: document.getElementById('invNo').value,
        date: document.getElementById('invDate').value,
        isGst: invType === 'gst',
        buyer: {
          name: document.getElementById('buyerName').value,
          mobile: document.getElementById('buyerMobile').value,
          address: document.getElementById('buyerAddress').value,
          gstin: document.getElementById('buyerGstin').value,
          stateCode: document.getElementById('buyerStateCode').value
        },
        items: [...currentItems],
        totals: { rounded: totalAmount }
      };

      invoices.unshift(newInv);

      if (invType === 'gst') settings.gstNextNum++;
      else settings.nextNum++;

      saveToStorage();
      alert('Invoice Saved Successfully!');
      
      currentItems = [];
      renderItemsTable();
      document.getElementById('invoiceForm').reset();
      loadStorageData();
    }

    // Filter History
    function filterHistory(type) {
      currentFilter = type;
      document.getElementById('filterGstBtn').className = type === 'gst' ? "px-4 py-2 border-b-2 border-blue-600 font-semibold text-blue-600" : "px-4 py-2 font-semibold text-gray-500";
      document.getElementById('filterNormalBtn').className = type === 'normal' ? "px-4 py-2 border-b-2 border-blue-600 font-semibold text-blue-600" : "px-4 py-2 font-semibold text-gray-500";
      renderHistory();
    }

    function renderHistory() {
      const tbody = document.getElementById('historyTableBody');
      tbody.innerHTML = '';

      const filtered = invoices.filter(inv => invoiceTypeOf(inv) === currentFilter);

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">No invoices found.</td></tr>`;
        return;
      }

      filtered.forEach(inv => {
        tbody.innerHTML += `
          <tr class="border-b hover:bg-gray-50">
            <td class="p-2 font-semibold">${inv.invoiceNo}</td>
            <td class="p-2">${inv.date}</td>
            <td class="p-2">${inv.buyer.name}</td>
            <td class="p-2">₹${inv.totals ? inv.totals.rounded : 0}</td>
            <td class="p-2">
              <button onclick="deleteInvoice(${inv.id})" class="text-red-600 font-medium">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    function deleteInvoice(id) {
      if (confirm('Are you sure you want to delete this invoice?')) {
        invoices = invoices.filter(i => i.id !== id);
        saveToStorage();
        renderHistory();
      }
    }

    // Backup & Restore
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ settings, invoices }));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.settings) settings = imported.settings;
          if (imported.invoices) invoices = imported.invoices;
          saveToStorage();
          alert('Data imported successfully!');
          location.reload();
        } catch (err) {
          alert('Invalid JSON file format!');
        }
      };
      reader.readAsText(file);
    }

    // UI Tab Switcher
    function switchTab(tab) {
      document.getElementById('tab-create').classList.add('hidden');
      document.getElementById('tab-history').classList.add('hidden');
      document.getElementById('tab-settings').classList.add('hidden');

      document.getElementById(`tab-${tab}`).classList.remove('hidden');

      if (tab === 'history') renderHistory();
    }

    // Settings Configuration
    function loadSettingsToForm() {
      document.getElementById('cfgCompanyName').value = settings.companyName || '';
      document.getElementById('cfgGstin').value = settings.gstin || '';
      document.getElementById('cfgPrefix').value = settings.prefix || '';
      document.getElementById('cfgGstPrefix').value = settings.gstPrefix || '';
      document.getElementById('cfgAddress').value = settings.address || '';
      document.getElementById('cfgContact').value = settings.contact || '';
    }

    function saveSettings() {
      settings.companyName = document.getElementById('cfgCompanyName').value;
      settings.gstin = document.getElementById('cfgGstin').value;
      settings.prefix = document.getElementById('cfgPrefix').value;
      settings.gstPrefix = document.getElementById('cfgGstPrefix').value;
      settings.address = document.getElementById('cfgAddress').value;
      settings.contact = document.getElementById('cfgContact').value;

      saveToStorage();
      alert('Settings updated!');
      location.reload();
    }

    // Initialize on Load
    window.onload = loadStorageData;
  </script>
</body>
</html>
